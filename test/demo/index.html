<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kor, enterprise components for UI5</title>
		<link rel="stylesheet" href="../../../../resources/kor/ui/kor.css" />
		<link rel="stylesheet" href="demo.css" />
		<script>
			const language = new URLSearchParams(location.search).get("lang") === "tr" ? "tr" : "en";
			window["sap-ui-config"] = { language };
			document.documentElement.lang = language;
		</script>
		<script
			id="sap-ui-bootstrap"
			src="../../../../resources/sap-ui-core.js"
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-async="true"
			data-sap-ui-compatVersion="edge"
			data-sap-ui-libs="kor.ui"
			data-sap-ui-resourceroots='{"kor.ui.demo": "./"}'
			data-sap-ui-onInit="module:kor/ui/demo/main"
		></script>
	</head>
	<body class="kor" id="content"></body>
</html>
