specVersion: "4.0"
type: library
metadata:
  name: kor.ui
framework:
  name: OpenUI5
  # Desteklenen en düşük sürüm. Yükseltmek, eski SAP sistemlerini dışarıda bırakır.
  version: "1.108.55"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_fiori_3
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
