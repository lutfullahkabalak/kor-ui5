specVersion: "4.0"
type: library
metadata:
  name: kor.ui
framework:
  name: OpenUI5
  # Yalnızca güncel sürümle uyumu denemek için; yayın derlemesi ui5.yaml ile yapılır.
  version: "1.154.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_fiori_3
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
